  <script>
    // Застосовуємо тему до першого кадру, щоб не було спалаху світлого екрана вночі
    (function () {
      var s = {};
      try { s = (JSON.parse(localStorage.getItem('slovo:v1')) || {}).settings || {}; } catch (e) {}
      var t = s.theme || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
